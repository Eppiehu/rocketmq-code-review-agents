<!doctype html>
<html><head><meta charset="utf-8"><title>架构</title>
<style>body{margin:0;background:#fff;font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E5597"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0602A"/></marker>
  </defs>
  <text x="700" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F3864">基于 rocketmq-a2a 的多智能体代码审查系统（学号 2601210448）</text>

  <!-- 输入 -->
  <rect x="30" y="330" width="170" height="110" rx="10" fill="#F4F5F7" stroke="#999"/>
  <text x="115" y="365" text-anchor="middle" font-size="16" font-weight="bold">输入</text>
  <text x="115" y="392" text-anchor="middle" font-size="13">代码片段 / 文件</text>
  <text x="115" y="414" text-anchor="middle" font-size="13">GitHub PR 链接</text>
  <line x1="200" y1="385" x2="252" y2="385" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <!-- Supervisor -->
  <rect x="255" y="270" width="230" height="230" rx="12" fill="#DCE6F2" stroke="#2E5597" stroke-width="2"/>
  <text x="370" y="305" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F3864">SupervisorAgent</text>
  <text x="370" y="335" text-anchor="middle" font-size="13">① 拆分维度 style/logic/security</text>
  <text x="370" y="358" text-anchor="middle" font-size="13">② 并行分发（A2A over RocketMQ）</text>
  <text x="370" y="381" text-anchor="middle" font-size="13">③ 订阅会话 LiteTopic 收结果</text>
  <text x="370" y="404" text-anchor="middle" font-size="13">④ 收齐后交 SummaryAgent</text>
  <text x="370" y="427" text-anchor="middle" font-size="13">⑤ 输出结构化报告</text>
  <text x="370" y="462" text-anchor="middle" font-size="12" fill="#555">会话 ID = LiteTopic = 消息 Key</text>
  <text x="370" y="481" text-anchor="middle" font-size="12" fill="#555">2601210448-session-时间-随机串</text>

  <!-- RocketMQ 区域 -->
  <rect x="560" y="60" width="470" height="760" rx="14" fill="#FFF8EE" stroke="#C0602A" stroke-dasharray="6,4"/>
  <text x="795" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0602A">RocketMQ 5.5.1（NameServer + Broker + Proxy gRPC:8081）</text>

  <!-- Normal topics -->
  <text x="795" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E5597">Normal Topic：任务分发</text>
  <g font-size="13">
    <rect x="590" y="135" width="410" height="42" rx="6" fill="#fff" stroke="#2E5597"/>
    <text x="605" y="161">rmqai-2601210448-review-task-style</text>
    <rect x="590" y="187" width="410" height="42" rx="6" fill="#fff" stroke="#2E5597"/>
    <text x="605" y="213">rmqai-2601210448-review-task-logic</text>
    <rect x="590" y="239" width="410" height="42" rx="6" fill="#fff" stroke="#2E5597"/>
    <text x="605" y="265">rmqai-2601210448-review-task-security</text>
    <rect x="590" y="291" width="410" height="42" rx="6" fill="#fff" stroke="#2E5597"/>
    <text x="605" y="317">rmqai-2601210448-review-task-summary</text>
  </g>

  <!-- Lite topic -->
  <text x="795" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E8B57">LiteTopic：会话级结果回传</text>
  <rect x="590" y="402" width="410" height="150" rx="8" fill="#EAF6EA" stroke="#2E8B57" stroke-width="2"/>
  <text x="605" y="428" font-size="13" font-weight="bold">父 Topic rmqai-2601210448-review-result（LITE）</text>
  <text x="605" y="450" font-size="12">绑定组 GID_2601210448_supervisor（lite.bind.topic）</text>
  <rect x="615" y="462" width="365" height="34" rx="5" fill="#fff" stroke="#2E8B57"/>
  <text x="625" y="484" font-size="12">LiteTopic 2601210448-session-...-acb61fe2</text>
  <rect x="615" y="504" width="365" height="34" rx="5" fill="#fff" stroke="#2E8B57" stroke-dasharray="4,3"/>
  <text x="625" y="526" font-size="12" fill="#555">LiteTopic 2601210448-session-...（每次审查一个）</text>

  <rect x="590" y="580" width="410" height="80" rx="8" fill="#F4F5F7" stroke="#888"/>
  <text x="605" y="606" font-size="13" font-weight="bold">父 Topic rmqai-2601210448-agent-p2p（LITE）</text>
  <text x="605" y="628" font-size="12">绑定组 GID_2601210448_agent_p2p</text>
  <text x="605" y="648" font-size="12" fill="#555">各 Agent 点对点 LiteTopic 2601210448-{role}-UUID</text>

  <text x="605" y="700" font-size="12" fill="#333">存储：LiteTopic 落在 LMQ 队列</text>
  <text x="605" y="720" font-size="12" fill="#333">%LMQ%$rmqai-2601210448-review-result$&lt;会话ID&gt;</text>
  <text x="605" y="748" font-size="12" fill="#333">Broker：enableLmq=true, enableMultiDispatch=true</text>
  <text x="605" y="776" font-size="12" fill="#333">消息 Key：会话 ID（+ requestId），可按 Key 溯源</text>

  <!-- Supervisor -> topics -->
  <line x1="485" y1="330" x2="588" y2="156" stroke="#2E5597" stroke-width="2" marker-end="url(#a)"/>
  <line x1="485" y1="345" x2="588" y2="208" stroke="#2E5597" stroke-width="2" marker-end="url(#a)"/>
  <line x1="485" y1="360" x2="588" y2="260" stroke="#2E5597" stroke-width="2" marker-end="url(#a)"/>
  <line x1="485" y1="400" x2="588" y2="312" stroke="#C0602A" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#o)"/>
  <text x="500" y="230" font-size="12" fill="#2E5597">并行</text>
  <text x="508" y="380" font-size="12" fill="#C0602A">收齐后</text>
  <!-- lite -> supervisor -->
  <line x1="588" y1="479" x2="488" y2="455" stroke="#2E8B57" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="550" y="530" text-anchor="end" font-size="12" fill="#2E8B57">LitePushConsumer</text>
  <text x="550" y="547" text-anchor="end" font-size="12" fill="#2E8B57">subscribeLite(会话ID)</text>

  <!-- Agents -->
  <g font-size="13">
    <rect x="1110" y="132" width="260" height="48" rx="8" fill="#DCE6F2" stroke="#2E5597"/>
    <text x="1240" y="152" text-anchor="middle" font-weight="bold">StyleAgent :18091</text>
    <text x="1240" y="171" text-anchor="middle" font-size="11">GID_2601210448_style · 命名/格式</text>
    <rect x="1110" y="184" width="260" height="48" rx="8" fill="#DCE6F2" stroke="#2E5597"/>
    <text x="1240" y="204" text-anchor="middle" font-weight="bold">LogicAgent :18092</text>
    <text x="1240" y="223" text-anchor="middle" font-size="11">GID_2601210448_logic · 逻辑/边界</text>
    <rect x="1110" y="236" width="260" height="48" rx="8" fill="#DCE6F2" stroke="#2E5597"/>
    <text x="1240" y="256" text-anchor="middle" font-weight="bold">SecurityAgent :18093</text>
    <text x="1240" y="275" text-anchor="middle" font-size="11">GID_2601210448_security · 注入/XSS/密钥</text>
    <rect x="1110" y="288" width="260" height="48" rx="8" fill="#FBE5D6" stroke="#C0602A"/>
    <text x="1240" y="308" text-anchor="middle" font-weight="bold">SummaryAgent :18094</text>
    <text x="1240" y="327" text-anchor="middle" font-size="11">GID_2601210448_summary · 汇总报告</text>
  </g>
  <line x1="1000" y1="156" x2="1108" y2="156" stroke="#2E5597" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1000" y1="208" x2="1108" y2="208" stroke="#2E5597" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1000" y1="260" x2="1108" y2="260" stroke="#2E5597" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1000" y1="312" x2="1108" y2="312" stroke="#C0602A" stroke-width="2" marker-end="url(#o)"/>
  <text x="1045" y="125" font-size="12" fill="#2E5597">PushConsumer</text>

  <!-- agents -> lite -->
  <path d="M1240,338 C1240,420 1100,470 1003,474" fill="none" stroke="#2E8B57" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="1255" y="400" font-size="12" fill="#2E8B57">结果写入会话 LiteTopic</text>
  <text x="1255" y="417" font-size="12" fill="#2E8B57">（Producer.setLiteTopic）</text>
  <line x1="1110" y1="620" x2="1003" y2="620" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>

  <rect x="1110" y="560" width="260" height="140" rx="8" fill="#fff" stroke="#999"/>
  <text x="1125" y="690" font-size="12">订阅自己的点对点 LiteTopic（虚线）</text>
  <text x="1240" y="586" text-anchor="middle" font-size="13" font-weight="bold">每个 Agent 进程</text>
  <text x="1125" y="610" font-size="12">Quarkus + A2A 服务端</text>
  <text x="1125" y="630" font-size="12">RocketMQA2AServerRoutes</text>
  <text x="1125" y="650" font-size="12">HTTP 端口仅用于发布 AgentCard</text>
  <text x="1125" y="670" font-size="12">-DagentRole 选择角色（同一 jar）</text>

  <!-- legend -->
  <g font-size="13">
    <line x1="40" y1="600" x2="90" y2="600" stroke="#2E5597" stroke-width="2" marker-end="url(#a)"/><text x="100" y="605">审查任务（Normal Topic）</text>
    <line x1="40" y1="630" x2="90" y2="630" stroke="#2E8B57" stroke-width="2.5" marker-end="url(#g)"/><text x="100" y="635">结果回传（LiteTopic）</text>
    <line x1="40" y1="660" x2="90" y2="660" stroke="#C0602A" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#o)"/><text x="100" y="665">汇总请求</text>
  </g>
</svg>
</body></html>
