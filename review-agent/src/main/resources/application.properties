# 端口在启动时用 -Dquarkus.http.port 覆盖: style 18091 / logic 18092 / security 18093 / summary 18094
quarkus.http.port=18091
quarkus.package.jar.type=uber-jar
quarkus.banner.enabled=false
# 让 Quarkus 扫描 rocketmq-a2a 里的 RocketMQA2AServerRoutes (@Startup)
quarkus.index-dependency.rocketmq-a2a.group-id=org.apache.rocketmq
quarkus.index-dependency.rocketmq-a2a.artifact-id=rocketmq-a2a
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{1.}] %s%e%n
quarkus.log.category."edu.homework".level=INFO
